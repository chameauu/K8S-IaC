---
# Jenkins Helm Chart Values
# Deploys Jenkins on Kubernetes with NFS storage - Simplified single pod

controller:
  # Admin credentials from vault
  admin:
    createSecret: true
    username: "{{ jenkins_admin_username }}"
    password: "{{ jenkins_admin_password }}"
  
  # Service configuration
  serviceType: NodePort
  nodePort: 30080
  
  # Resource limits
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"
  
  # Jenkins URL
  jenkinsUrl: "http://10.0.2.10:30080"
  jenkinsUriPrefix: ""
  
  # Disable sidecar containers to simplify deployment
  sidecars:
    configAutoReload:
      enabled: false
  
  # Init container configuration
  initContainerEnv:
    - name: COPY_REFERENCE_FILE_LOG
      value: "/var/log/copy_reference_file.log"
  
  # Custom init container to handle plugin copying with force flag
  initContainers:
    - name: init
      image: jenkins/jenkins:2.555.1-jdk21
      command:
        - sh
        - -c
        - |
          set -e
          echo "Starting Jenkins init container..."
          cp -rf /usr/share/jenkins/ref/plugins/* /var/jenkins_plugins/ 2>/dev/null || true
          cp -rf /usr/share/jenkins/ref/init.groovy.d/* /var/jenkins_home/init.groovy.d/ 2>/dev/null || true
          echo "Init container completed successfully"
      volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home
        - name: plugin-dir
          mountPath: /var/jenkins_plugins
  
  # Custom init script to force copy plugins without prompts
  initScripts:
    init-plugins.groovy: |
      // Force plugin installation without prompts
      println("Jenkins init script: Plugins will be installed")
  
  # Install essential plugins (let Jenkins resolve versions)
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - credentials-binding
    - docker-workflow

# Persistence configuration - use existing NFS PVC
persistence:
  enabled: true
  existingClaim: jenkins-nfs-pvc
  storageClass: nfs
  size: 1Gi
  accessMode: ReadWriteMany

# Service account
serviceAccount:
  create: true
  name: jenkins

# Enable Kubernetes agents for dynamic pod creation
agent:
  enabled: true
  namespace: jenkins
  image:
    repository: jenkins/inbound-agent
    tag: latest
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # Allow agents to run on any node
  podRetention: "Never"
  showRawYaml: false
